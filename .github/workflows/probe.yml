name: Temporary API probe
on:
  push:
    branches: [claude/sunny-weather-location-finder-keggwf]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          E=https://ensemble-api.open-meteo.com/v1/ensemble
          mk() { python3 -c "import random;random.seed($1);print(','.join(f'{random.uniform(40,60):.3f}' for _ in range($2)))"; }
          for i in 1 2 3 4 5 6; do
            LAT=$(mk $i 120); LON=$(mk $((i+50)) 120)
            curl -s -o r.json -w "req $i: status %{http_code} size %{size_download} time %{time_total}s\n" "$E?latitude=$LAT&longitude=$LON&daily=sunshine_duration&models=ecmwf_ifs025&forecast_days=15&timezone=auto"
            python3 -c "import json;d=json.load(open('r.json'));print('  ', d.get('reason') if isinstance(d,dict) else ('ok', len(d), [k for k in d[0]['daily']][:3], d[0]['daily']['sunshine_duration_member01'][:4]))"
          done
