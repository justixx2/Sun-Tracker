name: Temporary API probe
on:
  push:
    branches: [claude/sunny-weather-location-finder-keggwf]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Druskininkai, home detail (run 2)
        env: { LAT: "54.02", LON: "23.97", DETAIL: home }
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/live-check.js
