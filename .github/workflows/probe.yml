name: Temporary API probe
on:
  push:
    branches: [claude/sunny-weather-location-finder-keggwf]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: App, Druskininkai, Tuesday hour by hour
        env: { LAT: "54.02", LON: "23.97", DETAIL: home, HOUR_DAY: "2" }
        run: |
          set -o pipefail
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/live-check.js | sed -n '/hour by hour/,/45-day/p'
      - name: Yr (MET Norway) for the same day
        shell: python
        run: |
          import json, urllib.request
          from datetime import datetime, timedelta, timezone
          req = urllib.request.Request("https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=54.02&lon=23.97", headers={"User-Agent": "SunTracker-verify/1.0 github.com/justixx2/Sun-Tracker"})
          j = json.load(urllib.request.urlopen(req, timeout=60))
          day = (datetime.now(timezone.utc) + timedelta(days=2)).strftime("%Y-%m-%d")
          print("Yr for", day, "(local time = UTC+3)")
          for ts in j["properties"]["timeseries"]:
              t = datetime.fromisoformat(ts["time"].replace("Z", "+00:00")) + timedelta(hours=3)
              if t.strftime("%Y-%m-%d") != day: continue
              d = ts["data"]; inst = d["instant"]["details"]
              nxt = d.get("next_1_hours") or d.get("next_6_hours") or {}
              print(f"  {t:%H:%M} cloud {inst.get('cloud_area_fraction')}% (low {inst.get('cloud_area_fraction_low')}, high {inst.get('cloud_area_fraction_high')}) symbol {nxt.get('summary',{}).get('symbol_code')} rain-prob {nxt.get('details',{}).get('probability_of_precipitation')} temp {inst.get('air_temperature')}")
