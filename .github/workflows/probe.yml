name: Temporary API probe
on:
  push:
    branches: [claude/sunny-weather-location-finder-keggwf]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request, urllib.error
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=120) as r: return json.load(r)
              except urllib.error.HTTPError as e: return {"error": f"{e.code} {e.read().decode()[:200]}"}
              except Exception as e: return {"error": str(e)}
          u = "https://seasonal-api.open-meteo.com/v1/seasonal?latitude=55.920&longitude=21.070&timezone=auto&models=ecmwf_ec46&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,cloud_cover_mean&forecast_days=45"
          d = get(u)
          if "error" in d: print("ERR", d["error"])
          else:
              dd = d["daily"]; print("tz", d.get("timezone"), "days", len(dd["time"]), dd["time"][0], dd["time"][-1])
              print("vars", sorted({k.split('_member')[0] for k in dd}))
              for i in (0, 5, 12, 20, 30, 44):
                  pr = [dd[k][i] for k in dd if k.startswith("precipitation_sum") and dd[k][i] is not None]
                  cc = [dd[k][i] for k in dd if k.startswith("cloud_cover_mean") and dd[k][i] is not None]
                  tx = [dd[k][i] for k in dd if k.startswith("temperature_2m_max") and dd[k][i] is not None]
                  print(dd["time"][i], f"n={len(pr)} rain>=1mm {round(100*sum(v>=1 for v in pr)/max(len(pr),1))}%  cloud<=50 {round(100*sum(v<=50 for v in cc)/max(len(cc),1))}%  tmax {round(sum(tx)/max(len(tx),1),1)}")
