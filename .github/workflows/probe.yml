name: Temporary API probe
on:
  push:
    branches: [claude/sunny-weather-location-finder-keggwf]
    paths: [.github/workflows/probe.yml, tests/audit-hourly.py, app.js]
jobs:
  app-druskininkai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Today hour by hour
        env: { LAT: "54.02", LON: "23.97", DETAIL: home, HOUR_DAY: "0" }
        run: |
          set -o pipefail
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/live-check.js | sed -n '/Detail for/,/45-day/p'
      - name: Tomorrow hour by hour
        env: { LAT: "54.02", LON: "23.97", DETAIL: home, HOUR_DAY: "1" }
        run: |
          set -o pipefail
          sleep 65   # stay inside the free per-minute limit after the first full load
          node tests/live-check.js | sed -n '/hour by hour/,/45-day/p'
      - name: Do 429 replies carry CORS headers?
        if: always()
        run: |
          LAT=$(python3 -c "print(','.join(str(50+i*0.05) for i in range(120)))"); LON=$(python3 -c "print(','.join(str(20+i*0.05) for i in range(120)))")
          for i in 1 2 3; do
            curl -s -D - -o /dev/null -H "Origin: https://justixx2.github.io" "https://ensemble-api.open-meteo.com/v1/ensemble?latitude=$LAT&longitude=$LON&hourly=cloud_cover&models=ecmwf_ifs025&forecast_days=10" | grep -iE "^HTTP|access-control" ; echo ---
          done
  audit:
    needs: app-druskininkai
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u tests/audit-hourly.py
