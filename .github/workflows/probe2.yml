name: Temporary API probe 2
on:
  push:
    branches: [claude/sunny-weather-location-finder-keggwf]
    paths: [.github/workflows/probe2.yml]
jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          P = "latitude=50.060&longitude=19.940&timezone=auto&forecast_days=3"
          d = json.load(urllib.request.urlopen(f"https://api.open-meteo.com/v1/forecast?{P}&hourly=weather_code,cloud_cover,temperature_2m,precipitation_probability,is_day&models=best_match,icon_seamless", timeout=60))
          h = d["hourly"]; print("keys:", list(h)); print("utc_offset", d.get("utc_offset_seconds"))
          e = json.load(urllib.request.urlopen(f"https://ensemble-api.open-meteo.com/v1/ensemble?{P}&hourly=cloud_cover&models=ecmwf_ifs025", timeout=60))["hourly"]
          ck = [k for k in e if k.startswith("cloud_cover")]
          def g(name, model):
              return h.get(f"{name}_{model}") or (h.get(name) if model == "best_match" else None)
          for i, t in enumerate(h["time"]):
              if not t.startswith("2026-10-05") or int(t[11:13]) < 8 or int(t[11:13]) > 19: continue
              j = e["time"].index(t)
              cl = [e[k][j] for k in ck if e[k][j] is not None]
              share = round(100 * sum(c <= 60 for c in cl) / len(cl))
              m = g("cloud_cover", "best_match"); ic = g("cloud_cover", "icon_seamless")
              print(f"{t[11:16]} main {m} icon {ic} ENS share<=60 {share} (median {sorted(cl)[len(cl)//2]})  blend(w2,1,1)={round((2*share + (100 if m is not None and m<=60 else 0) + (100 if ic is not None and ic<=60 else 0))/4)}")
